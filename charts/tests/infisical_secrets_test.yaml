suite: Shared Infisical Secrets
templates:
  - templates/infisical-secrets.yaml
release:
  name: global-secrets
  namespace: default
tests:
  - it: creates no resources until secrets are configured
    asserts:
      - hasDocuments:
          count: 0

  - it: renders both registry secrets with shared authentication and separate paths
    values:
      - ../ci/registry-values.yaml
    asserts:
      - hasDocuments:
          count: 2
      - isAPIVersion:
          of: secrets.infisical.com/v1beta1
      - isKind:
          of: InfisicalStaticSecret
      - equal:
          path: metadata.namespace
          value: default
      - equal:
          path: spec.infisicalAuthRef
          value: {name: test-auth, namespace: test-auth-namespace}
      - equal:
          path: spec.syncOptions.refreshInterval
          value: 60s
      - equal:
          path: spec.sources
          value:
            - projectSlug: test-project
              environmentSlug: test
              secretPath: /registry
        documentIndex: 0
      - equal:
          path: spec.sources
          value:
            - projectSlug: test-project
              environmentSlug: test
              secretPath: /registry/harbor
        documentIndex: 1
      - equal:
          path: spec.targets[0].name
          value: github-registry-secret
        documentIndex: 0
      - equal:
          path: spec.targets[0].name
          value: harbor-registry-secret
        documentIndex: 1
      - equal:
          path: spec.targets[0].namespace
          value: default
      - equal:
          path: spec.targets[0].kind
          value: Secret
      - equal:
          path: spec.targets[0].secretType
          value: kubernetes.io/dockerconfigjson
      - equal:
          path: spec.targets[0].creationPolicy
          value: Owner
      - equal:
          path: spec.targets[0].template
          value:
            engineVersion: v1
            data:
              .dockerconfigjson: '{{ (index . "DOCKER_CONFIG_JSON").Value }}'

  - it: places reflection annotations on the generated Secrets only
    values:
      - ../ci/registry-values.yaml
    asserts:
      - isNull:
          path: metadata.annotations
      - equal:
          path: spec.targets[0].metadata
          value:
            labels: {}
            annotations:
              reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
              reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"

  - it: uses the release namespace for source Secrets
    release:
      namespace: shared
    values:
      - ../ci/registry-values.yaml
    asserts:
      - equal:
          path: metadata.namespace
          value: shared
      - equal:
          path: spec.targets[0].namespace
          value: shared

  - it: supports explicit mappings with punctuation and defaults to Opaque without reflection
    values:
      - ../ci/registry-values.yaml
    set:
      secrets:
        - name: application-secret
          secretPath: /application
          keys:
            username: APP.USER
            password: APP-PASSWORD
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.targets[0].secretType
          value: Opaque
      - equal:
          path: spec.targets[0].metadata
          value: {labels: {}, annotations: {}}
      - equal:
          path: spec.targets[0].template.data
          value:
            username: '{{ (index . "APP.USER").Value }}'
            password: '{{ (index . "APP-PASSWORD").Value }}'

  - it: respects explicitly disabled reflection
    values:
      - ../ci/registry-values.yaml
    set:
      secrets:
        - name: github-registry-secret
          secretPath: /registry
          type: kubernetes.io/dockerconfigjson
          keys:
            .dockerconfigjson: DOCKER_CONFIG_JSON
          reflection:
            enabled: false
    documentIndex: 0
    asserts:
      - equal:
          path: spec.targets[0].metadata.annotations
          value: {}

  - it: rejects missing shared authentication
    values:
      - ../ci/registry-values.yaml
    set:
      infisical.authRef.name: ""
    asserts:
      - failedTemplate:
          errorMessage: infisical.authRef.name is required when secrets are configured

  - it: rejects a missing project
    values:
      - ../ci/registry-values.yaml
    set:
      infisical.projectSlug: ""
    asserts:
      - failedTemplate:
          errorMessage: infisical.projectSlug is required when secrets are configured

  - it: rejects duplicate target names
    values:
      - ../ci/registry-values.yaml
    set:
      secrets:
        - name: github-registry-secret
          secretPath: /registry
          keys:
            .dockerconfigjson: DOCKER_CONFIG_JSON
        - name: github-registry-secret
          secretPath: /registry/harbor
          keys:
            .dockerconfigjson: DOCKER_CONFIG_JSON
    asserts:
      - failedTemplate:
          errorMessage: secrets contains duplicate name github-registry-secret
