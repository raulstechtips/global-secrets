{{- $names := dict }}
{{- range .Values.secrets }}
{{- if hasKey $names .name }}
{{- fail (printf "secrets contains duplicate name %s" .name) }}
{{- end }}
{{- $_ := set $names .name true }}
---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "global-secrets.labels" $ | nindent 4 }}
spec:
  infisicalAuthRef:
    name: {{ required "infisical.authRef.name is required when secrets are configured" $.Values.infisical.authRef.name | quote }}
    namespace: {{ required "infisical.authRef.namespace is required when secrets are configured" $.Values.infisical.authRef.namespace | quote }}
  syncOptions:
    refreshInterval: {{ $.Values.infisical.refreshInterval | quote }}
  sources:
    - projectSlug: {{ required "infisical.projectSlug is required when secrets are configured" $.Values.infisical.projectSlug | quote }}
      environmentSlug: {{ required "infisical.environmentSlug is required when secrets are configured" $.Values.infisical.environmentSlug | quote }}
      secretPath: {{ .secretPath | quote }}
  targets:
    - name: {{ .name }}
      namespace: {{ $.Release.Namespace }}
      kind: Secret
      secretType: {{ .type | default "Opaque" | quote }}
      creationPolicy: Owner
      metadata:
        labels: {}
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          {{- with .reflector }}
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: {{ join "," . | quote }}
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: {{ join "," . | quote }}
          {{- end }}
      template:
        engineVersion: v1
        data:
          {{- range $key, $sourceKey := .keys }}
          {{ $key | quote }}: {{ printf "{{ (index . %s).Value }}" ($sourceKey | quote) | quote }}
          {{- end }}
{{- end }}
